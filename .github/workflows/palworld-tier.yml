
name: Palworld Tier Update (Weekly) - GitHub + Deploy

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

concurrency:
  group: palworld-tier-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests beautifulsoup4 lxml
      - name: Fetch & Build Weekly - Palworld V7 (no wiki API)
        run: |
          python games/palworld/scripts/update_palworld_weekly.py
          ls -lh games/palworld/data/
      - name: Sync to WP theme
        run: |
          mkdir -p wp-content/themes/generatepress-child/palworld-tier/data
          cp games/palworld/data/*.json wp-content/themes/generatepress-child/palworld-tier/data/
      - name: Commit & Push
        run: |
          git config user.name "NoPickle Bot"
          git config user.email "bot@nopickle.co.kr"
          git add -A
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "auto: Palworld weekly $(date +%Y-W%V) - fix wiki DNS & restore SEO"
          git pull --rebase --autostash origin main
          git push origin main
      - name: Deploy to WP Server
        if: success()
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "wp-content/themes/generatepress-child/palworld-tier/data/*.json"
          target: "/var/www/nopickle.co.kr/wp-content/themes/generatepress-child/palworld-tier/data/"
          strip_components: 5
          overwrite: true

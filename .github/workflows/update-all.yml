name: NIKKE Tier Update (Weekly)

on:
  schedule:
    - cron: '0 3 * * 1' # 매주 월요일 12:00 KST (03:00 UTC)
  workflow_dispatch:

concurrency:
  group: nikke-tier-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml

      - name: Run NIKKE updater
        working-directory: games/nikke
        run: python crawler.py

      - name: Sync JSON + Images to theme
        run: |
          mkdir -p wp-content/themes/generatepress-child/nikke-tier/data
          mkdir -p wp-content/themes/generatepress-child/nikke-tier/assets/images
          cp games/nikke/data/*.json wp-content/themes/generatepress-child/nikke-tier/data/ || true
          cp games/nikke/assets/images/* wp-content/themes/generatepress-child/nikke-tier/assets/images/ 2>/dev/null || true

      - name: Commit & Push (rebase safe)
        run: |
          git config user.name "tier-bot"
          git config user.email "bot@nopickle.co.kr"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: nikke weekly tier update $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main

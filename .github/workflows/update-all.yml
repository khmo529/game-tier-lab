name: 전체 티어표 자동 업데이트
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  update-nikke:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 니케 크롤러 실행
        run: |
          pip install requests
          python games/nikke/crawler.py

      - name: 변경사항 커밋
        run: |
          git config --global user.name 'tier-bot'
          git config --global user.email 'bot@factory.com'
          git add games/nikke/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: nikke update" && git push)

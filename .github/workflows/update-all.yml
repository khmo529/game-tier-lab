name: 전체 티어표 자동 업데이트
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write

jobs:
  update-nikke:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 니케 크롤러 실행
        run: |
          pip install requests
          python games/nikke/crawler.py

      - name: 자동 커밋
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: nikke update"
          file_pattern: "games/nikke/data/*"

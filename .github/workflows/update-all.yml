name: 전체 티어표 자동 업데이트
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # <- 이게 핵심! 하나 실패해도 나머지는 계속 실행
      matrix:
        game: [nikke] # <- 일단 니케 1개만! 성공하면 뒤에 3개 추가하자

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: ${{ matrix.game }} 크롤러 실행
        run: |
          if [! -f "games/${{ matrix.game }}/crawler.py" ]; then
            echo "크롤러 파일 없음 - 스킵"
            exit 0
          fi
          pip install requests
          python games/${{ matrix.game }}/crawler.py

      - name: 변경사항 커밋
        run: |
          git config --global user.name 'tier-bot'
          git config --global user.email 'bot@factory.com'
          git add games/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: ${{ matrix.game }} update" && git push)

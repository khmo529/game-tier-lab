name: 전체 티어표 자동 업데이트
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write

jobs:
  update-nikke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 니케 크롤러 실행
        run: |
          pip install requests
          python games/nikke/crawler.py
          ls -R games/nikke/data/

      - name: 자동 커밋
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "auto: nikke update"
          file_pattern: "games/nikke/data/*"

      - name: 워드프레스로 SFTP 배포
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: nopickle
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "games/nikke/data/*"
          target: "/home/nopickle/htdocs/nopickle.co.kr/wp-content/themes/generatepress_child/nikke-tier/data/"
          strip_components: 3
          overwrite: true

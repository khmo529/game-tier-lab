name: 전체 티어표 자동 업데이트
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write

jobs:
  update-nikke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 니케 크롤러 실행 (prydwen 연동)
        run: |
          pip install requests beautifulsoup4 lxml
          python games/nikke/crawler.py
          echo "=== 로컬 파일 ==="
          ls -lh games/nikke/data/
          cat games/nikke/data/characters.json | head -20

      - name: 자동 커밋
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "auto: nikke update from prydwen"
          file_pattern: "games/nikke/data/*"

      - name: 배포 전 원격 폴더 확인
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: nopickle
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            echo "--- dash 폴더 ---"
            ls -lh /home/nopickle/htdocs/nopickle.co.kr/wp-content/themes/generatepress-child/nikke-tier/data/ || echo "dash 폴더 없음"
            echo "--- underscore 폴더 ---"
            ls -lh /home/nopickle/htdocs/nopickle.co.kr/wp-content/themes/generatepress_child/nikke-tier/data/ || echo "underscore 폴더 없음"

      - name: 워드프레스로 SFTP 배포 (dash - 실제 사용중)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: nopickle
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "games/nikke/data/*"
          target: "/home/nopickle/htdocs/nopickle.co.kr/wp-content/themes/generatepress-child/nikke-tier/data/"
          strip_components: 3
          overwrite: true

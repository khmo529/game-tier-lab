name: OW2 Weekly Auto Update
on:
  schedule:
    - cron: '0 2 * * 1' # 매주 월요일 11시 KST (02:00 UTC)
  workflow_dispatch: # 수동 실행 버튼

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - name: Fetch & Build Weekly
        run: python scripts/update_overwatch_weekly.py
      - name: Commit & Push
        run: |
          git config user.name "NoPickle Bot"
          git config user.email "bot@nopickle.co.kr"
          git add games/overwatch2/data/weekly-2026.json
          git diff --staged --quiet || git commit -m "auto: OW2 weekly $(date +%Y-W%V)"
          git push

name: OW2 Tier Update (Weekly) - GitHub Only Source

on:
  schedule:
    - cron: '0 2 * * 1' # 매주 월요일 11:00 KST
  workflow_dispatch:

concurrency:
  group: ow2-tier-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch & Build Weekly
        run: |
          python games/overwatch2/scripts/update_overwatch_weekly.py
          echo "=== Build result ==="
          ls -lh games/overwatch2/data/

      - name: Sync to WP theme (GitHub repo 내부)
        run: |
          mkdir -p wp-content/themes/generatepress-child/overwatch-tier/data
          cp games/overwatch2/data/*.json wp-content/themes/generatepress-child/overwatch-tier/data/ || true
          echo "=== Synced ==="
          ls -lh wp-content/themes/generatepress-child/overwatch-tier/data/

      - name: Commit & Push
        run: |
          git config user.name "NoPickle Bot"
          git config user.email "bot@nopickle.co.kr"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "auto: OW2 weekly $(date +%Y-W%V)"
          git pull --rebase --autostash origin main
          git push origin main

name: BD2 티어표 자동 업데이트

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write

jobs:
  update-bd2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: BD2 업데이터 실행
        run: |
          pip install requests beautifulsoup4 lxml
          python games/browndust2/tier_updater.py
          echo "=== 로컬 파일 ==="
          ls -lh games/browndust2/data/
          cat games/browndust2/data/weekly-update.json | head -20

      - name: 자동 커밋
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "auto: bd2 update"
          file_pattern: "games/browndust2/data/*"

      - name: 배포 전 원격 폴더 확인
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: nopickle
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            echo "--- bd2 dash 폴더 ---"
            ls -lh /home/nopickle/htdocs/nopickle.co.kr/wp-content/themes/generatepress-child/browndust2-tier/data/ || echo "dash 폴더 없음"
            echo "--- bd2 underscore 폴더 ---"
            ls -lh /home/nopickle/htdocs/nopickle.co.kr/wp-content/themes/generatepress_child/browndust2-tier/data/ || echo "underscore 폴더 없음"

      - name: 워드프레스로 SFTP 배포 (bd2 data)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: nopickle
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "games/browndust2/data/*"
          target: "/home/nopickle/htdocs/nopickle.co.kr/wp-content/themes/generatepress-child/browndust2-tier/data/"
          strip_components: 3
          overwrite: true

      - name: 캐시 퍼지
        if: success()
        run: |
          curl -X POST "${{ secrets.WP_WEBHOOK_URL }}" \
            -H "X-BD2-SECRET: ${{ secrets.BD2_WEBHOOK_SECRET }}" \
            -d "{\"run_id\":\"${{ github.run_id }}\"}" || echo "webhook skip"

name: BD2 Tier Auto

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      reason:
        description: '수동 실행 사유'
        required: false
        default: 'manual'

concurrency:
  group: bd2-tier
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4

      - name: Run updater
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: python game/browndust2/tier_updater.py

      - name: Check diff
        id: diff
        run: |
          if git status --porcelain | grep -E "characters\.json|weekly-update\.json" > /dev/null; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit & Push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "bd2-bot"
          git config user.email "bot@browndust2.tier"
          git add -A game/browndust2/**/data/*.json browndust2-tier/data/*.json
          git commit -m "auto: bd2 $(date +%Y-%m-%d) [skip ci]"
          git push

      # SFTP 키교환 방식 배포
      - name: Deploy via SFTP (key)
        if: steps.diff.outputs.changed == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          protocol: sftp
          port: 22
          private-key: ${{ secrets.SFTP_PRIVATE_KEY }}
          local-dir: ./game/browndust2/browndust2-tier/
          server-dir: /wp-content/themes/generatepress_child/browndust2-tier/
          exclude: |
            **/.git*
            **/.github/**

      - name: Purge cache via webhook
        if: steps.diff.outputs.changed == 'true'
        run: |
          curl -X POST "${{ secrets.WP_WEBHOOK_URL }}" \
            -H "X-BD2-SECRET: ${{ secrets.BD2_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"run_id\":\"${{ github.run_id }}\"}"

name: BD2 Tier Auto

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4

      - name: Run updater
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python games/browndust2/tier_updater.py
          ls -lh games/browndust2/data/

      - name: Sync data to deploy folder
        run: |
          mkdir -p games/browndust2/browndust2-tier/data
          cp -v games/browndust2/data/*.json games/browndust2/browndust2-tier/data/

      - name: Check diff
        id: diff
        run: |
          if git status --porcelain | grep -E "characters\.json|weekly-update\.json" > /dev/null; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit & Push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "bd2-bot"
          git config user.email "bot@browndust2.tier"
          git add games/browndust2/data/*.json games/browndust2/browndust2-tier/data/*.json
          git commit -m "auto: bd2 $(date +%Y-%m-%d) [skip ci]"
          git push

      # 여기부터가 핵심 - 키교환 SFTP 배포
      - name: Deploy via SFTP with key
        if: steps.diff.outputs.changed == 'true'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          key: ${{ secrets.SFTP_PRIVATE_KEY }}
          port: 22
          source: "games/browndust2/browndust2-tier/*"
          target: "/wp-content/themes/generatepress_child/browndust2-tier/"
          strip_components: 2
          overwrite: true

      - name: Purge cache via webhook
        if: steps.diff.outputs.changed == 'true'
        run: |
          curl -X POST "${{ secrets.WP_WEBHOOK_URL }}" \
            -H "X-BD2-SECRET: ${{ secrets.BD2_WEBHOOK_SECRET }}" \
            -d "{\"run_id\":\"${{ github.run_id }}\"}"

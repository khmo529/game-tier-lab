name: Tier Update (Weekly) - GitHub Only Source

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: tier-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml

      - name: Run BD2 updater (fix images + grades)
        working-directory: games/browndust2
        run: |
          python tier_updater.py
          ls -lh assets/images/ | wc -l
          echo "justia count:"
          grep -c "justia.png" data/characters.json || true

      - name: Run NIKKE updater
        working-directory: games/nikke
        run: python tier_updater.py

      - name: Sync to WP theme (delete trash)
        run: |
          echo "Cleaning trash files..."
          rm -f games/browndust2/assets/images/17682*.png
          rm -f wp-content/themes/generatepress-child/browndust2-tier/assets/images/17682*.png
          rm -f games/browndust2/assets/images/123*.png
          
          mkdir -p wp-content/themes/generatepress-child/browndust2-tier/data
          mkdir -p wp-content/themes/generatepress-child/nikke-tier/data
          mkdir -p wp-content/themes/generatepress-child/browndust2-tier/assets/images

          cp games/browndust2/data/*.json wp-content/themes/generatepress-child/browndust2-tier/data/
          cp games/nikke/data/*.json wp-content/themes/generatepress-child/nikke-tier/data/
          cp games/browndust2/assets/images/* wp-content/themes/generatepress-child/browndust2-tier/assets/images/ 2>/dev/null || true

          echo "After sync:"
          ls wp-content/themes/generatepress-child/browndust2-tier/assets/images/ | wc -l
          grep -c "justia.png" wp-content/themes/generatepress-child/browndust2-tier/data/characters.json || true

      - name: Commit & Push
        run: |
          git config user.name "tier-bot"
          git config user.email "bot@nopickle.co.kr"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: auto restore images + sync to wp (justia fix)"
          git pull --rebase origin main
          git push origin main
